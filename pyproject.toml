[project]
name = "font-split"
version = "0.1.0"
description = "Pre-shard fonts into Unicode-aware WOFF2 shards, CSS, and a manifest"
readme = "README.md"
authors = [
    { name = "Kuriyona", email = "Kuriyona@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "brotli>=1.2.0",
    "fonttools>=4.66.0",
    "rich>=15.0.0",
    "uharfbuzz>=0.56.2",
]

[project.scripts]
font-sharder = "font_split.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "opencc-python-reimplemented>=0.1.7",
]
